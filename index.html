<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>9Devy LLC | Luxury Creative Studio</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500&family=Roboto&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      font-family: 'Roboto', sans-serif;
      background-color: #fff;
      color: #222;
    }
    header {
      background-color: #000;
      color: #fff;
      padding: 60px 20px;
      text-align: center;
    }
    header h1 {
      font-family: 'Playfair Display', serif;
      font-size: 2.8rem;
      margin: 0;
      letter-spacing: 1px;
    }
    header p {
      margin-top: 10px;
      font-size: 1.1rem;
      color: #ccc;
    }
    .container {
      padding: 40px 20px;
      max-width: 960px;
      margin: auto;
      text-align: center;
    }
    .btn {
      display: inline-block;
      margin: 15px 10px;
      padding: 12px 28px;
      background-color: #000;
      color: #fff;
      text-decoration: none;
      border-radius: 5px;
      font-weight: bold;
      transition: 0.3s;
    }
    .btn:hover {
      background-color: #444;
    }
    footer {
      text-align: center;
      padding: 20px;
      font-size: 0.9rem;
      color: #999;
    }
  </style>
</head>
<body>

  <header>
    <h1>9Devy LLC</h1>
    <p>Luxury Visuals for Visionary Brands</p>
  </header>

  <div class="container">
    <p>We specialize in high-end media production, storytelling, and brand visuals that inspire.</p>
    <a href="#" class="btn">Book Services</a>
    <a href="#" class="btn">View Portfolio</a>
    <a href="#" class="btn">Contact</a>
  </div>

  <footer>
    &copy; 2025 9Devy LLC. All rights reserved.
  </footer>

</body>
</html>
